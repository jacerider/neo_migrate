services:
  neo_migrate.workspace:
    class: Drupal\neo_migrate\Workspace
    arguments: ['%app.root%']

  neo_migrate.catalog:
    class: Drupal\neo_migrate\LegacyCatalog

  neo_migrate.field_normalizer:
    class: Drupal\neo_migrate\FieldNormalizer

  neo_migrate.source.paragraphs:
    class: Drupal\neo_migrate\Source\ParagraphsSource
    arguments: ['@entity_field.manager', '@module_handler', '@neo_migrate.field_normalizer']

  neo_migrate.inventory:
    class: Drupal\neo_migrate\Inventory
    arguments: ['@entity_type.manager', '@neo_migrate.source.paragraphs', '@neo_migrate.field_normalizer', '@path_alias.manager']

  neo_migrate.url_collector:
    class: Drupal\neo_migrate\UrlCollector
    arguments: ['@entity_type.manager', '@path_alias.manager', '@config.factory', '@module_handler']

  neo_migrate.metrics:
    class: Drupal\neo_migrate\MetricsLog
    arguments: ['@neo_migrate.workspace']

  neo_migrate.auditor:
    class: Drupal\neo_migrate\Auditor
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@module_handler'
      - '@extension.list.module'
      - '@extension.list.theme'
      - '@theme_handler'
      - '@config.factory'
      - '@config.manager'
      - '@database'
      - '@neo_migrate.catalog'
      - '@neo_migrate.source.paragraphs'
      - '@neo_migrate.inventory'
      - '%app.root%'

  neo_migrate.audit_markdown:
    class: Drupal\neo_migrate\AuditMarkdown

  # neo_icon is optional: neo_migrate installs before any Neo module.
  neo_migrate.icon_resolver:
    class: Drupal\neo_migrate\IconNameResolver
    arguments: ['@neo_migrate.catalog', '@?neo_icon.repository']

  neo_migrate.icon_importer:
    class: Drupal\neo_migrate\Importer\IconImporter
    arguments: ['@entity_type.manager', '@module_handler', '@file_system']

  neo_migrate.tree_field_installer:
    class: Drupal\neo_migrate\Importer\TreeFieldInstaller
    arguments: ['@entity_type.manager', '@entity_display.repository', '@config.factory']

  neo_migrate.site_settings_importer:
    class: Drupal\neo_migrate\Importer\SiteSettingsImporter
    arguments: ['@entity_type.manager', '@entity_display.repository', '@config.factory', '@neo_migrate.catalog']

  neo_migrate.icon_field_importer:
    class: Drupal\neo_migrate\Importer\IconFieldImporter
    arguments: ['@entity_type.manager', '@entity_display.repository']

  neo_migrate.favicon_importer:
    class: Drupal\neo_migrate\Importer\FaviconImporter
    arguments: ['@entity_type.manager', '@config.factory', '@file_system']

  neo_migrate.metatag_rewriter:
    class: Drupal\neo_migrate\Importer\MetatagRewriter
    arguments: ['@config.factory', '@neo_migrate.catalog']

  neo_migrate.toolbar_importer:
    class: Drupal\neo_migrate\Importer\ToolbarImporter
    arguments: ['@entity_type.manager', '@config.factory', '@config.storage.sync', '@neo_migrate.icon_resolver', '@neo_migrate.catalog', '@extension.list.module']

  neo_migrate.markup_rewriter:
    class: Drupal\neo_migrate\Content\MarkupRewriter

  neo_migrate.value_transformer:
    class: Drupal\neo_migrate\Content\ValueTransformer
    arguments: ['@neo_migrate.markup_rewriter', '@entity_type.manager']

  neo_migrate.tree_converter:
    class: Drupal\neo_migrate\Content\TreeConverter
    arguments: ['@entity_type.manager', '@neo_migrate.value_transformer']

  neo_migrate.tree_writer:
    class: Drupal\neo_migrate\Writer\ComponentTreeWriter
    arguments: ['@keyvalue', '@renderer']

  # neo_alchemist's value plugin manager tells a provider-filled prop from an
  # unset one; optional like neo_icon above.
  neo_migrate.content_verifier:
    class: Drupal\neo_migrate\Verify\ContentVerifier
    arguments:
      - '@entity_type.manager'
      - '@neo_migrate.source.paragraphs'
      - '@neo_migrate.tree_converter'
      - '@neo_migrate.field_normalizer'
      - '@path_alias.manager'
      - '@keyvalue'
      - '@renderer'
      - '@?plugin.manager.neo_component_value'

  # Above the admin and default negotiators, below the AJAX base page one, so
  # an AJAX request keeps the theme of the page that made it.
  neo_migrate.preview_negotiator:
    class: Drupal\neo_migrate\Theme\PreviewThemeNegotiator
    arguments: ['@request_stack', '@current_user', '@router.admin_context', '@config.factory', '@theme_handler']
    tags:
      - { name: theme_negotiator, priority: 500 }
  Drupal\neo_migrate\Theme\PreviewThemeNegotiator: '@neo_migrate.preview_negotiator'
